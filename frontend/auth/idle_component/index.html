<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>html, body { margin: 0; padding: 0; height: 0; overflow: hidden; }</style>
</head>
<body>
<script>
(() => {
  "use strict";
  const send = (type, data = {}) => {
    window.parent.postMessage(
      { isStreamlitMessage: true, type, ...data }, "*"
    );
  };
  let initialized = false;
  let observedDocument = null;
  let lastClientActivity = Date.now();
  let lastReportAt = 0;
  let timeoutMs = 300000;
  let timedOut = false;
  let counter = 0;
  const instance = Math.random().toString(36).slice(2);
  const sendEvent = (type) => {
    counter += 1;
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { type, id: `${instance}-${counter}` },
    });
  };

  function recordActivity(event) {
    if (timedOut) return;
    // Do not count activity from synthetic events generated by the UI.
    if (event && event.isTrusted === false) return;
    lastClientActivity = Date.now();
    if (lastClientActivity - lastReportAt >= 5000) {
      lastReportAt = lastClientActivity;
      sendEvent("activity");
    }
  }

  function observeApp() {
    try {
      // The component is served on the same origin as the Streamlit page.
      // Listening to the parent means typing within Streamlit forms counts,
      // even though a Streamlit form doesn't rerun until it is submitted.
      const doc = window.parent.document;
      if (!doc || !doc.body) throw new Error("No parent document");
      observedDocument = doc;
      for (const name of [
        "pointerdown", "pointermove", "keydown", "wheel",
        "scroll", "touchstart"
      ]) {
        doc.addEventListener(name, recordActivity, { passive: true, capture: true });
      }
    } catch (_err) {
      sendEvent("observer_error");
    }
  }

  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "streamlit:render") {
      const candidate = Number(event.data.args?.timeout_ms);
      if (Number.isFinite(candidate) && candidate > 0) timeoutMs = candidate;
      if (!initialized) {
        initialized = true;
        observeApp();
      }
    }
  });

  window.addEventListener("pagehide", () => {
    if (!observedDocument) return;
    for (const name of [
      "pointerdown", "pointermove", "keydown", "wheel",
      "scroll", "touchstart"
    ]) {
      observedDocument.removeEventListener(name, recordActivity, true);
    }
  });

  setInterval(() => {
    if (!timedOut && Date.now() - lastClientActivity >= timeoutMs) {
      timedOut = true;
      sendEvent("idle");
    }
  }, 1000);

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
